[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geodisaster-fm"
version = "0.1.0"
description = "GeoDisaster-FM: Geospatial foundation models for rapid multi-hazard disaster impact mapping in Japan."
readme = "PLAN.md"
requires-python = ">=3.10"
authors = [{name = "GeoDisaster-FM Team"}]
license = {text = "Apache-2.0"}
keywords = [
    "remote-sensing",
    "foundation-models",
    "disaster",
    "earth-observation",
    "alphaearth",
    "crossearth",
]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "torch>=2.1",
    "torchvision>=0.16",
    "pytorch-lightning>=2.2",
    "torchmetrics>=1.3",
    "transformers>=4.40",
    "timm>=0.9",
    "segmentation-models-pytorch>=0.3.3",
    "einops>=0.7",
    "rasterio>=1.3",
    "rioxarray>=0.15",
    "xarray>=2024.1",
    "geopandas>=0.14",
    "shapely>=2.0",
    "pyproj>=3.6",
    "fiona>=1.9",
    "rtree>=1.1",
    "earthengine-api>=0.1.395",
    "geemap>=0.32",
    "osmnx>=1.9,<2.0",
    "networkx>=3.2",
    "tqdm>=4.66",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "cartopy>=0.22",
    "pyarrow>=14.0",
    "structlog>=24.1",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "black>=24.3",
    "mypy>=1.9",
    "ipykernel>=6.29",
    "jupyterlab>=4.1",
]
fm = [
    "open-clip-torch>=2.24",
    "ftfy",
    "regex",
]

[project.scripts]
geodisaster = "geodisaster.cli:main"

[tool.setuptools.packages.find]
include = ["geodisaster*"]
exclude = ["tests*", "data*", "notebooks*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "N"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
