# Deploy the static experiment dashboard (outputs/site/index.html) to GitHub Pages.
# Re-runs whenever outputs/site/ or the README changes on main, or when triggered
# manually from the Actions tab. Single-file HTML, no build step needed.
name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'outputs/site/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: outputs/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
