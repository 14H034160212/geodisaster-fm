# Deploy the static experiment dashboard (outputs/site/index.html) to GitHub Pages.
#
# Manual-only since 2026-06-05: the project's primary public deployment is
# Cloudflare Pages (https://geodisaster-fm.pages.dev/) which builds itself
# from the main branch without GitHub Actions. The GitHub Pages site has
# not been enabled in repository Settings → Pages, so auto-pushing on every
# main commit was producing recurring "Get Pages site failed" failure
# emails. This workflow is preserved (single-file HTML, no build step) so
# that it can be re-enabled later by:
#   1. Settings → Pages → Source: "GitHub Actions"
#   2. Then either restore the `push` trigger here, or just click
#      "Run workflow" from the Actions tab as needed.
name: Deploy dashboard to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: outputs/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
